<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>本地医疗系统演示</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section id="login-panel" class="panel login-panel">
        <p class="eyebrow">LOCAL DEMO ONLY</p>
        <h1>医疗记录自动化演示系统</h1>
        <p class="notice">仅用于本地 UI-TARS、截图同步和 OCR 测试，不包含真实数据。</p>
        <form id="login-form">
          <label>用户名<input id="username" value="demo" autocomplete="off" /></label>
          <label>密码<input id="password" type="password" value="demo" autocomplete="off" /></label>
          <button type="submit">登录演示系统</button>
          <p id="login-error" class="error" role="alert"></p>
        </form>
      </section>

      <section id="app-panel" class="panel hidden">
        <header class="topbar">
          <div>
            <p class="eyebrow">LOCAL DEMO ONLY</p>
            <h1>患者记录查询</h1>
          </div>
          <button id="logout-button" class="secondary">退出</button>
        </header>
        <div class="search-row">
          <label for="search-input">姓名或患者编号</label>
          <input id="search-input" placeholder="例如：演示患者甲 或 DEMO-001" />
          <button id="search-button">搜索</button>
        </div>
        <p class="notice">测试账号：demo / demo。所有姓名、编号、记录内容均为虚构。</p>
        <div id="results" class="results" aria-live="polite"></div>
        <section id="details" class="details hidden"></section>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
